services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: local-only-password
      POSTGRES_DB: platform
    ports: ['5432:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U platform']
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: [postgres-data:/var/lib/postgresql/data]

  redis:
    image: redis:8-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  rocketmq-namesrv:
    image: apache/rocketmq:5.3.2
    command: sh mqnamesrv
    ports: ['9876:9876']

  rocketmq-broker:
    image: apache/rocketmq:5.3.2
    command: sh mqbroker -n rocketmq-namesrv:9876 --enable-proxy
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
    depends_on: [rocketmq-namesrv]
    ports: ['8081:8081', '10911:10911']

  minio:
    image: minio/minio:RELEASE.2026-07-15T18-52-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: localminio
      MINIO_ROOT_PASSWORD: local-only-password
    ports: ['9000:9000', '9001:9001']
    volumes: [minio-data:/data]

  mailpit:
    image: axllent/mailpit:v1.27
    ports: ['1025:1025', '8025:8025']

volumes:
  postgres-data: {}
  minio-data: {}
